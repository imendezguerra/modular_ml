[build-system]
requires = ["setuptools>=77", "wheel"]  # 77+ for the SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "modular_ml"
dynamic = ["version"]
description = "Config-driven PyTorch template: Hydra + dataclasses configs, modular networks and losses, full wandb tracking."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irene Mendez Guerra" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "h5py>=3.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16.4",
    "matplotlib>=3.8",
    "typer>=0.12",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3"]
docs = [
    "mkdocs>=1.6,<2",  # MkDocs 2.0 removes the plugin system that mkdocstrings needs
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Documentation = "https://imendezguerra.github.io/modular_ml/"
Repository = "https://github.com/imendezguerra/modular_ml"

[project.scripts]
modular-ml = "modular_ml.pipeline.pipeline:app"

[tool.setuptools.dynamic]
version = { attr = "modular_ml.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
