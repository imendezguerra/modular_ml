[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular_ml"
version = "0.1.0"
description = "A Hydra + dataclasses template for building modular, fully wandb-tracked ML models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "modular_ml authors" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "h5py>=3.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16.4",
    "matplotlib>=3.8",
    "typer>=0.12",
    "loguru>=0.7",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
modular-ml = "modular_ml.pipeline.pipeline:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
