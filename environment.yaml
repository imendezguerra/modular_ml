name: modular_ml
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.2
  - numpy>=1.26
  - scikit-learn>=1.3
  - h5py>=3.10
  - matplotlib>=3.8
  - pyyaml>=6.0
  - pip:
      # Installs the package plus its runtime, dev (pytest, ruff) and docs
      # (mkdocs) dependencies from pyproject.toml. Heavy scientific packages
      # above are provided by conda and simply satisfied here.
      - -e ".[dev,docs]"
